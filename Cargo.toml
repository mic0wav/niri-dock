[package]
name = "dock"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = "0.11.6"
gtk4-layer-shell = "0.4.0"
log = "0.4.26"
niri_ipc_types = {package = "niri-ipc", version = "=26.4.0" }
relm4 = "0.9.1"
thiserror = "2.0"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "net", "io-util", "time", "sync"] }
tracker = "0.2.2"
toml = "0.8.20"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
gtk4 = "0.9"
